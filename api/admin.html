<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#012019" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap" rel="stylesheet">
<title>Pitwall · Admin</title>
<style>
  :root{ --bg:#012019; --bg2:#02312a; --card:rgba(4,42,36,.72); --card2:#06342c; --line:rgba(200,226,92,.13);
    --line2:rgba(200,226,92,.24); --txt:#eef5ec; --muted:#9fb7ac; --accent:#c8e25c; --accent-d:#aecb3f; --profit:#5fe39a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(900px 520px at 50% -10%,rgba(200,226,92,.10),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg));
    min-height:100vh; font-size:16px; letter-spacing:-.01em;}
  h1{font-family:"Sora",sans-serif; font-weight:800; letter-spacing:-.025em;}
  .wrap{max-width:1000px; margin:0 auto; padding:22px 16px 60px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; backdrop-filter:blur(12px); margin-bottom:16px;}
  label{display:block; font-size:.72rem; color:var(--muted); margin:14px 0 7px; text-transform:uppercase; letter-spacing:.07em; font-weight:700;}
  label:first-child{margin-top:0;}
  input{width:100%; background:#072b25; color:var(--txt); border:1px solid var(--line2); border-radius:12px; padding:14px; font-size:16px; outline:none;}
  input:focus{border-color:var(--accent); box-shadow:0 0 0 4px rgba(200,226,92,.18);}
  .btn{width:100%; border:none; border-radius:13px; padding:15px; font-size:1.02rem; font-weight:800; cursor:pointer;
    color:#0c2a05; background:linear-gradient(180deg,var(--accent),var(--accent-d)); margin-top:16px;}
  .btn.sm{width:auto; padding:9px 16px; font-size:.85rem; margin:0;}
  .btn.ghost{background:transparent; color:var(--txt); border:1px solid var(--line2);}
  .err{color:#fda4af; font-size:.85rem; margin-top:12px; display:none;}
  .brandhead{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .tile{width:46px; height:46px; border-radius:13px; display:flex; align-items:flex-end; justify-content:center; gap:3px; padding:9px 0 10px;
    border:1px solid var(--line2); background:linear-gradient(160deg,#063a31,#04231d);}
  .tile span{width:4px; border-radius:2px; background:var(--accent);}
  .grid{display:grid; gap:12px;}
  .metrics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .metric{background:var(--card2); border:1px solid var(--line); border-radius:13px; padding:14px 16px;}
  .metric .k{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .metric .v{font-size:1.7rem; font-weight:800; margin-top:5px;}
  .metric .v.profit{color:var(--profit);}
  h2{font-size:1.05rem; margin:0 0 14px;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:720px){ .two{grid-template-columns:1fr;} }
  .barRow{margin:11px 0;}
  .barRow .h{display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:5px;}
  .bar{height:11px; background:rgba(200,226,92,.12); border-radius:999px; overflow:hidden;}
  .bar>span{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent-d),var(--accent));}
  .wbars{display:flex; align-items:flex-end; gap:8px; height:130px; padding-top:8px;}
  .wbars .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
  .wbars .col i{display:block; width:100%; max-width:34px; background:linear-gradient(180deg,var(--accent),var(--accent-d)); border-radius:6px 6px 0 0; min-height:3px;}
  .wbars .col b{font-size:.85rem; font-weight:800;} .wbars .col em{font-size:.62rem; color:var(--muted); font-style:normal;}
  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  th,td{text-align:right; padding:10px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em;}
  td.profit{color:var(--profit); font-weight:800;}
  .scroll{overflow-x:auto;}
  .pill{display:inline-block; background:rgba(200,226,92,.14); color:var(--accent); font-size:.62rem; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;}
  .muted{color:var(--muted);} .sub{color:var(--muted); font-size:.85rem;}
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .row{display:flex; gap:8px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login" style="max-width:400px; margin:7vh auto 0;">
    <div class="brandhead" style="justify-content:center;">
      <div class="tile"><span style="height:9px;opacity:.55;"></span><span style="height:15px;opacity:.75;"></span><span style="height:22px;"></span><span style="height:13px;opacity:.65;"></span></div>
      <h1 style="font-size:1.7rem; margin:0;">Pit<span style="color:var(--accent);">wall</span> <span class="pill" style="vertical-align:middle;">Admin</span></h1>
    </div>
    <div class="card">
      <label>Admin email</label>
      <input id="email" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email" />
      <label>Password</label>
      <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button class="btn" id="signin">Sign in</button>
      <div class="err" id="err"></div>
    </div>
    <div class="sub" style="text-align:center;">Restricted to Pitwall admins.</div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" style="display:none;">
    <div class="topbar">
      <div class="brandhead" style="margin:0;">
        <div class="tile"><span style="height:9px;opacity:.55;"></span><span style="height:15px;opacity:.75;"></span><span style="height:22px;"></span><span style="height:13px;opacity:.65;"></span></div>
        <h1 style="font-size:1.4rem; margin:0;">Pit<span style="color:var(--accent);">wall</span> <span class="pill">Admin</span></h1>
      </div>
      <div class="row">
        <button class="btn sm ghost" id="refresh">↻ Refresh</button>
        <button class="btn sm ghost" id="signout">Sign out</button>
      </div>
    </div>
    <div id="dashBody"><div class="sub">Loading…</div></div>
    <div class="sub" id="stamp" style="margin-top:6px;"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPA_URL="https://gvyvjfldvbwdiexjyxzh.supabase.co";
  const SUPA_KEY="sb_publishable_qRVzjnqhCrUN6xxrKlWDtw_aSprTZ0T";
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  const $=s=>document.querySelector(s);
  const gbp=n=>"£"+Math.round(Number(n)||0).toLocaleString("en-GB");
  const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const fmt=d=>{ if(!d) return "—"; try{ return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }catch(e){ return "—"; } };
  const ago=d=>{ if(!d) return "never"; const s=(Date.now()-new Date(d))/86400000; if(s<1) return "today"; if(s<2) return "yesterday"; if(s<31) return Math.floor(s)+"d ago"; return fmt(d); };

  function showErr(m){ const e=$("#err"); e.textContent=m; e.style.display="block"; }
  async function doSignIn(){
    $("#err").style.display="none";
    const email=$("#email").value.trim(), password=$("#pass").value;
    if(!email||!password){ showErr("Enter your email and password."); return; }
    $("#signin").disabled=true;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    $("#signin").disabled=false;
    if(error){ showErr(error.message); return; }
    enter();
  }
  async function enter(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ $("#login").style.display="block"; $("#dash").style.display="none"; return; }
    $("#login").style.display="none"; $("#dash").style.display="block";
    loadDash(session.access_token);
  }
  async function loadDash(token){
    $("#dashBody").innerHTML='<div class="sub">Loading…</div>';
    let r, d;
    try{ r=await fetch("/api/admin",{ headers:{ Authorization:"Bearer "+token } }); d=await r.json(); }
    catch(e){ $("#dashBody").innerHTML='<div class="card">Could not reach the server.</div>'; return; }
    if(!r.ok){
      if(r.status===403){ $("#dashBody").innerHTML='<div class="card">This account isn\'t an admin. Sign in with an admin email.</div>'; }
      else { $("#dashBody").innerHTML='<div class="card">'+esc((d&&d.error)||"Error loading data.")+'</div>'; }
      return;
    }
    render(d);
    $("#stamp").textContent="Updated "+new Date(d.generatedAt).toLocaleString("en-GB");
  }
  function render(d){
    const t=d.totals, ins=d.insights;
    const metric=(k,v,cls)=>`<div class="metric"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`;
    const metrics=`<div class="grid metrics">
      ${metric("Users", t.users)}
      ${metric("Active", t.activeUsers)}
      ${metric("Jobs logged", t.jobs)}
      ${metric("Completed", t.closed)}
      ${metric("Total profit", gbp(t.profit),"profit")}
      ${metric("Total charged", gbp(t.charged))}
      ${metric("Hours logged", t.hours+"h")}
      ${metric("Avg profit / hr", gbp(t.avgGph),"profit")}
    </div>`;

    const maxW=Math.max(1,...d.weekly.map(w=>w.count));
    const weekly=`<div class="card"><h2>Jobs logged · last 8 weeks</h2><div class="wbars">${
      d.weekly.map(w=>`<div class="col"><b>${w.count}</b><i style="height:${Math.round(w.count/maxW*92)}%"></i><em>${esc(w.label)}</em></div>`).join("")
    }</div></div>`;

    const maxG=Math.max(1,...ins.typeRows.map(r=>r.gph));
    const types=ins.typeRows.length? ins.typeRows.map(r=>`<div class="barRow"><div class="h"><span>${esc(r.type)} <span class="muted">(${r.n})</span></span><span class="profit" style="font-weight:800">${gbp(r.gph)}/h</span></div><div class="bar"><span style="width:${Math.max(4,r.gph/maxG*100)}%"></span></div></div>`).join("") : '<div class="sub">No completed timed jobs yet.</div>';
    const makes=ins.topMakes.length? ins.topMakes.map(m=>`<div class="barRow"><div class="h"><span>${esc(m.make)}</span><span class="muted">${m.n}</span></div></div>`).join("") : '<div class="sub">No data yet.</div>';

    const insightCards=`<div class="two">
      <div class="card"><h2>Most profitable job types <span class="sub">(all users)</span></h2>${types}</div>
      <div class="card"><h2>Insights</h2>
        <div class="grid metrics" style="grid-template-columns:1fr 1fr;">
          ${metric("MOT pass rate", ins.motPass==null?"—":ins.motPass+"%")}
          ${metric("Comeback rate", ins.comebacks+"%")}
          ${metric("Avg labour / job", gbp(ins.avgLabour))}
          ${metric("Avg job value", gbp(ins.avgJobValue))}
        </div>
        <h2 style="margin:18px 0 10px;">Top makes seen</h2>${makes}
      </div>
    </div>`;

    const rows=d.users.map(u=>`<tr>
      <td>${esc(u.email)}</td>
      <td>${fmt(u.joined)}</td>
      <td>${ago(u.lastActive)}</td>
      <td>${u.jobs}</td>
      <td>${u.closed}</td>
      <td>${u.customers}</td>
      <td>${u.hours}h</td>
      <td class="profit">${gbp(u.profit)}</td>
      <td>${gbp(u.gph)}/h</td>
    </tr>`).join("");
    const users=`<div class="card"><h2>Users</h2><div class="scroll"><table>
      <thead><tr><th>Email</th><th>Joined</th><th>Last active</th><th>Jobs</th><th>Done</th><th>Cust.</th><th>Hours</th><th>Profit</th><th>£/hr</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="9" class="sub">No users yet.</td></tr>'}</tbody>
    </table></div></div>`;

    $("#dashBody").innerHTML = metrics + weekly + insightCards + users;
  }

  $("#signin").onclick=doSignIn;
  $("#pass").addEventListener("keydown",e=>{ if(e.key==="Enter") doSignIn(); });
  $("#refresh").onclick=async()=>{ const { data:{ session } }=await sb.auth.getSession(); if(session) loadDash(session.access_token); };
  $("#signout").onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  enter();
</script>
</body>
</html>
